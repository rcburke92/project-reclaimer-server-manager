<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; font-src 'self' file:; script-src 'self'">
  <title>Halo 3 Server Manager</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Halo 3<span class="sep">//</span>Server Manager</h1>
    <span class="app-version" id="app-version"></span>
    <span class="spacer"></span>
    <span class="workspace-label" id="workspace-label"></span>
  </header>

  <nav class="tab-strip" id="tab-strip"></nav>
  <main class="tab-content" id="tab-content"></main>
  <footer class="status-bar" id="status-bar"></footer>

  <div class="toast-host" id="toast-host"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
